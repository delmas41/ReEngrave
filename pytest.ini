[pytest]
markers =
    omr_smoke: end-to-end OMR pipeline tests that need test PDFs on disk
    omr_phase2: phase-2 symbol library and template-matcher tests
    omr_phase2_5: phase-2.5 annotation framework tests
    omr_annotate: phase-2.5 annotation web server + JSON-aware scorer tests
    omr_training: DeepScoresV2 -> YOLOv8 training pipeline tests (no GPU/dataset needed)
    slow: applied automatically by tools/omr/tests/conftest.py from
        durations.json (a measured, per-file duration over a threshold) or
        from a reference to library/, omr-weights, .venv-surya, .venv-omrned,
        or a PDF fixture in the file's own name or source. Run the fast tier
        alone with `-m "not slow"`; the default run (no -m) is unaffected and
        still runs everything.
