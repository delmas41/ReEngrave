name: Deploy ReEngrave

# Disabled from auto-triggering on push (2026-09-03): every one of the 123
# runs since this workflow was added has failed. ReEngrave's actual
# production path is the self-hosted VPS in scripts/deploy.sh /
# docker-compose.prod.yml, not Vercel/Railway, and the VERCEL_TOKEN /
# VERCEL_ORG_ID / VERCEL_PROJECT_ID / RAILWAY_TOKEN repo secrets this
# workflow needs were never configured. Kept for reference / possible future
# use — trigger manually from the Actions tab if needed. See
# version_memory.md for the fixes applied alongside this (the backend
# Docker build context was also wrong).
on:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Deploy frontend to Vercel
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: '--prod'

  # ---------------------------------------------------------------------------
  # Deploy backend to Railway
  # ---------------------------------------------------------------------------
  deploy-backend:
    name: Deploy Backend (Railway)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t reengrave-backend:${{ github.sha }} \
            -t reengrave-backend:latest \
            .

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --detach
        # TODO: Replace with the official railway-deploy GitHub Action
        # once it supports Dockerfile-based deploys without additional config.
        # See: https://docs.railway.app/deploy/github-actions
